# Phase 2: PECS demo — replaces gitops-promoter-dag-config.yaml in dag-example-apps.
#
# Swaps the hand-written DAGCommitStatus for a PreviousEnvironmentCommitStatus.
# The PECS controller auto-generates an owned DAGCommitStatus with a linear chain:
#
#   dag-env/dev → dag-env/e2e → dag-env/perf → dag-env/prod
#
# Everything else (GitRepository, PromotionStrategy, ArgoCDCommitStatus) is unchanged.
apiVersion: promoter.argoproj.io/v1alpha1
kind: GitRepository
metadata:
  name: dag-example-apps
  namespace: promoter-system
spec:
  github:
    name: dag-example-apps
    owner: Kaiying-Yu
  scmProviderRef:
    name: gitops-promoter-lynn-local
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: PromotionStrategy
metadata:
  name: demo-dag
  namespace: promoter-system
spec:
  activeCommitStatuses:
  - key: argocd-health
  proposedCommitStatuses:
  - key: promoter-dag
  environments:
  - autoMerge: false
    branch: dag-env/dev
  - autoMerge: true
    branch: dag-env/e2e
  - autoMerge: true
    branch: dag-env/perf
  - autoMerge: true
    branch: dag-env/prod
  gitRepositoryRef:
    name: dag-example-apps
---
# PreviousEnvironmentCommitStatus: no manual dependsOn needed.
# The controller reads the PromotionStrategy env order and auto-generates the linear chain.
apiVersion: promoter.argoproj.io/v1alpha1
kind: PreviousEnvironmentCommitStatus
metadata:
  name: demo-dag
  namespace: promoter-system
spec:
  promotionStrategyRef:
    name: demo-dag
  key: promoter-dag
---
apiVersion: promoter.argoproj.io/v1alpha1
kind: ArgoCDCommitStatus
metadata:
  name: demo-dag-argocd-health
  namespace: promoter-system
spec:
  key: argocd-health
  promotionStrategyRef:
    name: demo-dag
  applicationSelector:
    matchExpressions:
    - key: demo-dag-env
      operator: Exists
